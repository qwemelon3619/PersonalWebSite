events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 10M;
    resolver 127.0.0.11;  # Docker internal DNS resolver

    # Increase buffer sizes for large headers (e.g., OAuth URLs)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    upstream web_front {
        server web-front:3001;
    }

    server {
        listen 80;
        listen [::]:80;  # enable IPv6 listening
        server_name localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Proxy /data to Azurite blob storage
        location /img/ {
            # Public bucket must be read-only: no PUT/DELETE through the proxy.
            limit_except GET {
                deny all;
            }
            proxy_pass http://azurite:10000/devstoreaccount1/blogcontainer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /api to API Gateway
        location /api/ {
            proxy_pass http://api-gateway:8080/;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy everything else to web-front
        location / {
            proxy_pass http://web_front/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}