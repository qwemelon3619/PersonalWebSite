{{template "header.html" .}}

<section class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="auth-card text-center">
                    <div class="mono-text display-6 mb-3">// Oops</div>
                    <h1 class="display-6 mb-3">Something went wrong</h1>
                    <p class="lead text-muted mb-4">{{if .error}}{{ .error }}{{else}}Something went wrong.{{end}}</p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="/" class="btn btn-outline-dark">Home</a>
                        <button class="btn btn-accent" onclick="window.history.back();">Go Back</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{{template "footer.html" .}}
