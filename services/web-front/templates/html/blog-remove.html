{{ template "header.html" .}}

<section class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card text-center">
                    <h5 class="mb-3">Remove "{{ .title }}"</h5>
                    <p class="text-muted mb-4">Are you sure you want to remove this article?</p>
                    <form action="/blog-remove/{{.articleNumber}}" method="POST">
                        <div class="d-flex gap-2 justify-content-center">
                            <button class="btn btn-outline-dark" type="button" onclick="window.history.back();">Cancel</button>
                            <button class="btn btn-accent" type="submit">Remove</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{{ template "footer.html" . }}
